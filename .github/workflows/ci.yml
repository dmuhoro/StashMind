name: StashMind CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (clean install, no --legacy-peer-deps)
        run: npm ci

      - name: TypeScript strict typecheck
        run: npm run typecheck

      - name: Unit + integration test suite
        run: npm run test

      - name: Stability verification
        run: npm run verify
